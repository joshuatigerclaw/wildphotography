name = "wildphotography-visit-consumer"
main = "visit-consumer.ts"
compatibility_date = "2026-03-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

[vars]
NEXTJS_ENV = "production"

[[queues.consumers]]
queue = "visit-queue"
max_batch_size = 100
max_batch_timeout = 5
